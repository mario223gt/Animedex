<script>
const catalogo=document.getElementById("catalogo"),buscar=document.getElementById("buscar");

const animes=[
["akamegakill.jpg","Akame ga Kill"],
["assassinationclassrom.jpg","Assassination Classroom"],
["baki.jpg","Baki"],
["berserk.jpg","Berserk"],
["bleach.jpg","Bleach"],
["bokunokokoro.jpg","The Dangers in My Heart"],
["chainsawman.jpg","Chainsaw Man"],
["classromoftheelite.jpg","Classroom of the Elite"],
["codegeass.jpg","Code Geass"],
["dandadan.jpg","Dandadan"],
["darlinginthefranxx.jpg","Darling in the FranXX"],
["deathnote.jpg","Death Note"],
["dragonballz.jpg","Dragon Ball Z"],
["fireforce.jpg","Fire Force"],
["fullmetalalchemits.jpg","Fullmetal Alchemist"],
["gals.jpg","Gals!"],
["gurrenlagann.jpg","Tengen Toppa Gurren Lagann"],
["haikyuu.jpg","Haikyuu!!"],
["hajimenoippo.jpg","Hajime no Ippo"],
["horimiya.jpg","Horimiya"],
["hunterxhunter.jpg","Hunter x Hunter"],
["initiald.jpg","Initial D"],
["jojosbizarreadventure.jpg","JoJo's Bizarre Adventure"],
["jujutsukaisen.jpg","Jujutsu Kaisen"],
["kaguyasama.jpg","Kaguya-sama: Love is War"],
["komicantcommunicate.jpg","Komi Can't Communicate"],
["losdiariosdelaboticaria.jpg","Los diarios de la boticaria"],
["mobpsycho100.jpg","Mob Psycho 100"],
["mydressupdarling.jpg","My Dress-Up Darling"],
["nanatsunotaizai.jpg","Nanatsu no Taizai"],
["narutoshipudden.jpg","Naruto Shippuden"],
["neonevangelion.jpg","Neon Genesis Evangelion"],
["onepiece.jpg","One Piece"],
["pokemon.jpg","Pokémon"],
["re_zero.jpg","Re:Zero"],
["sao.jpg","Sword Art Online"],
["serialexperimentlain.jpg","Serial Experiments Lain"],
["shingekinokioyin.jpg","Attack on Titan"],
["slamdunk.jpg","Slam Dunk"],
["sololeveling.jpg","Solo Leveling"],
["tokyoghoul.jpg","Tokyo Ghoul"],
["totoro.jpg","Mi vecino Totoro"],
["vinlandsaga.jpg","Vinland Saga"],
["yourname.jpg","Your Name"],
["yugioh.jpg","Yu-Gi-Oh!"],
["yuyuhakusho.jpg","Yu Yu Hakusho"]
];

const visibles=animes.slice(0,15);

function mostrar(lista){
catalogo.innerHTML=lista.length?lista.map(a=>`
<div class="col-6 col-md-4 col-lg-3">
<a href="anime.html?anime=${encodeURIComponent(a[1])}" class="text-decoration-none">
<div class="card h-100">
<img src="./img_dex/${a[0]}" alt="${a[1]}">
<div class="card-body text-center"><h5 class="card-title">${a[1]}</h5></div>
</div></a></div>`).join(""):`<p class="text-center text-white-50">No se encontró ningún anime.</p>`;
}

mostrar(visibles);

buscar.addEventListener("input",()=>{
let texto=buscar.value.toLowerCase().trim();
if(!texto)return mostrar(visibles);
mostrar(animes.filter(a=>a[1].toLowerCase().includes(texto)));
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
