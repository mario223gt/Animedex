body{background:#050505;color:#fff}.text-verde,.navbar-brand{color:#39FF14!important}.border-morado{border-color:#7B2CBF!important}.nav-link:hover{color:#9D4EDD!important}.contacto{max-width:700px;margin:auto;background:#111;border:2px solid #7B2CBF;border-radius:15px;padding:30px;box-shadow:0 0 25px #7b2cbf66}.form-control,.form-select,.input-group-text{background:#050505;color:#fff;border:2px solid #7B2CBF}.form-control:focus,.form-select:focus{background:#050505;color:#fff;border-color:#39FF14;box-shadow:0 0 10px #39FF1480}.input-group-text,.form-label{color:#39FF14}.form-label{font-weight:bold}.btn-enviar{background:#39FF14;color:#000;font-weight:bold;border:0}.btn-enviar:hover{background:#9D4EDD;color:#fff}.form-check-input:checked{background:#39FF14;border-color:#39FF14}
</style>

<section class="py-5"><div class="container">
<div class="text-center mb-5">
<h1 class="display-4 fw-bold text-verde">Contacto</h1>
<hr class="border-morado border-3 mx-auto" style="max-width:250px;opacity:1">
<p class="text-white-50">¿Tienes alguna sugerencia o comentario sobre AnimeDex?</p>
</div>

<div class="contacto">
<form onsubmit="enviar(event)">

<div class="row">
<div class="mb-3 col-12 col-md-6"><label class="form-label">Nombre</label><input class="form-control" placeholder="Tu nombre" required></div>
<div class="mb-3 col-12 col-md-6"><label class="form-label">Apellidos</label><input class="form-control" placeholder="Tus apellidos" required></div>
<div class="mb-3 col-12 col-md-6"><label class="form-label">RUT</label><input class="form-control" placeholder="12.345.678-9" required></div>
<div class="mb-3 col-12 col-md-6"><label class="form-label">Correo electrónico</label><input type="email" class="form-control" placeholder="tu@email.com" required><div class="form-text text-white-50">Tu correo no será compartido.</div></div>
<div class="mb-3 col-12 col-md-6"><label class="form-label">Región o ciudad</label><select class="form-select" required><option disabled selected>Selecciona una opción</option><option>Valdivia</option><option>Santiago</option><option>Concepción</option><option>Puerto Montt</option></select></div>
<div class="mb-3 col-12 col-md-6"><label class="form-label">Fecha de nacimiento</label><input type="date" class="form-control" required></div>
</div>

<div class="mb-3"><label class="form-label">Teléfono</label><div class="input-group"><span class="input-group-text">+56 9</span><input type="tel" class="form-control" placeholder="1234 5678" required></div></div>

<div class="mb-3">
<label class="form-label d-block">Tipo de consulta</label>
<div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="c" required><label class="form-check-label">Sugerencia</label></div>
<div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="c"><label class="form-check-label">Problema</label></div>
<div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="c"><label class="form-check-label">Información</label></div>
</div>

<div class="mb-3">
<label class="form-label">Nivel de interés: 1 Bajo — 10 Alto</label>
<input type="range" class="form-range" min="1" max="10" value="5">
</div>

<div class="mb-3"><label class="form-label">Adjuntar archivo</label><input type="file" class="form-control" accept=".pdf,.jpg,.png"></div>

<div class="mb-3"><label class="form-label">Comentarios</label><textarea class="form-control" rows="4" placeholder="Escribe tu mensaje..." required></textarea></div>

<div class="form-check mb-3">
<input class="form-check-input" type="checkbox" required>
<label class="form-check-label">Acepto los <a href="#" class="text-verde">términos y condiciones</a></label>
</div>

<div class="form-check form-switch mb-4">
<input class="form-check-input" type="checkbox">
<label class="form-check-label">Suscribirme al boletín</label>
</div>

<div class="d-flex justify-content-end gap-2">
<button type="reset" class="btn btn-outline-secondary">Limpiar</button>
<button type="submit" class="btn btn-enviar">Enviar</button>
</div>

</form>
</div>
</div></section>

</div>
</footer>

<script>
function enviar(e){e.preventDefault();alert("¡Mensaje enviado correctamente!");e.target.reset()}
</script>
